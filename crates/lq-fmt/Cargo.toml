[package]
name = "lq-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["biome"]
# Format embedded JS, TS and CSS with Biome. Without it those blocks print verbatim.
biome = [
    "dep:biome_css_formatter",
    "dep:biome_css_parser",
    "dep:biome_css_syntax",
    "dep:biome_formatter",
    "dep:biome_js_formatter",
    "dep:biome_js_parser",
    "dep:biome_js_syntax",
    "dep:biome_languages",
    "dep:biome_rowan",
]

[dependencies]
lq-syntax.workspace = true
memchr.workspace = true
rayon.workspace = true
regex = "1"
serde_json = "1"
unicode-ident = "1"
biome_css_formatter = { git = "https://github.com/biomejs/biome.git", tag = "@biomejs/biome@2.6.5", optional = true }
biome_css_parser = { git = "https://github.com/biomejs/biome.git", tag = "@biomejs/biome@2.6.5", optional = true }
biome_css_syntax = { git = "https://github.com/biomejs/biome.git", tag = "@biomejs/biome@2.6.5", optional = true }
biome_formatter = { git = "https://github.com/biomejs/biome.git", tag = "@biomejs/biome@2.6.5", optional = true }
biome_js_formatter = { git = "https://github.com/biomejs/biome.git", tag = "@biomejs/biome@2.6.5", optional = true }
biome_js_parser = { git = "https://github.com/biomejs/biome.git", tag = "@biomejs/biome@2.6.5", optional = true }
biome_js_syntax = { git = "https://github.com/biomejs/biome.git", tag = "@biomejs/biome@2.6.5", optional = true }
biome_languages = { git = "https://github.com/biomejs/biome.git", tag = "@biomejs/biome@2.6.5", optional = true }
biome_rowan = { git = "https://github.com/biomejs/biome.git", tag = "@biomejs/biome@2.6.5", optional = true }
