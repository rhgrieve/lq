[package]
name = "lq-wasm"
description = "lq's formatter and theme check for the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lq-check = { path = "../lq-check" }
lq-fmt = { path = "../lq-fmt" }
lq-json = { path = "../lq-json" }
lq-theme = { path = "../lq-theme" }
serde_json = "1"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]
