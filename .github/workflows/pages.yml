name: Site

# Builds the landing page and its playground, lq compiled to wasm, and publishes them to GitHub
# Pages. Needs Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['crates/**', 'data/**', 'site/**', 'Cargo.lock', '.cargo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: site-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: site-${{ runner.os }}-
      - name: Install wasm-bindgen
        run: |
          want=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          if [[ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $want" ]]; then
            cargo install wasm-bindgen-cli --version "$want" --locked --force
          fi
      - name: Install wasm-opt
        env:
          BINARYEN: version_133
        run: |
          base=https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN
          file=binaryen-$BINARYEN-x86_64-linux.tar.gz
          curl -fsSLO "$base/$file" && curl -fsSLO "$base/$file.sha256"
          sha256sum -c "$file.sha256"
          tar xzf "$file"
          echo "$PWD/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"
      - run: cargo test --locked -p lq-wasm
      - run: scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
